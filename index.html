<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        div {
            display: inline-block;
            border: 5px double #ccc;
            padding: 20px;
            border-radius: 10px;
            background: linear-gradient(45deg, #000000, #808080);
            margin-bottom: 5%;
        }

        section{
            font-family: 'Courier New', Courier, monospace;
        }

        h1 {
            color: white;
        }

        input {
            width: 200px;
            padding: 10px;
            font-size: 20px;
            text-align: right;
            margin-bottom: 10px;
            background-color: #808080;
            color: white;
        }

        button {
            width: 50px;
            height: 40px;
            font-size: 18px;
            margin: 3px;
            background-color: #808080;
        }

        .clear-btn {
            width: 150px;
            background-color: #ffffff;
            color: black;
            background-color: rgba(253, 25, 0, 0.785);
        }

        .operations {
            background-color: #c97900;
            color: rgb(0, 0, 0);
        }
    </style>
</head>
<body>
    <div>
        <h1>Simple Calculator</h1>

        <input type="text" id="display" readonly>
        <br><br>

        <button onclick="add('7')"> 7 </button>
        <button onclick="add('8')"> 8 </button>
        <button onclick="add('9')"> 9 </button>
        <button class="operations" onclick="add('/')"> ÷ </button>

        <br>

        <button onclick="add('4')"> 4 </button>
        <button onclick="add('5')"> 5 </button>
        <button onclick="add('6')"> 6 </button>
        <button class="operations" onclick="add('*')"> x </button>

        <br>

        <button onclick="add('1')"> 1 </button>
        <button onclick="add('2')"> 2 </button>
        <button onclick="add('3')"> 3 </button>
        <button class="operations" onclick="add('-')"> - </button>

        <br>

        <button onclick="add('0')"> 0 </button>
        <button onclick="add('.')"> . </button>
        <button class="operations" onclick="calculate()"> = </button>
        <button class="operations" onclick="add('+')"> + </button>

        <br>

        <button class="clear-btn" onclick="clearDisplay()"> Clear </button>
    </div>

    <section id="about">
        <h2>About</h2>
      
        <p>
            Simple Calculator © Since 2026 <br>
            Developer Name: Ajay Quitoriano Mendaros
        </p>
      
    </section>

    <script>
        let calculated = false;

        function add(value){
            if(calculated){
                document.getElementById('display').value = '';
                calculated = false;
            }

            document.getElementById('display').value += value;
        }

        function calculate(){
            document.getElementById('display').value = 
                eval(document.getElementById('display').value);

            calculated = true;
        }

        function clearDisplay(){
            document.getElementById('display').value = '';
            calculated = false;
        }
    </script>
</body>
</html>
